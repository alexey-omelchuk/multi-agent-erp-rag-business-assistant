[project]
name = "prueba-tecnica-agentes"
version = "0.1.0"
description = "Sistema multi-agente que responde preguntas de negocio sobre ERP, produccion y documentos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "langchain-core>=1.0",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.1.0",
    "fastembed>=0.9.1",
    "deepagents>=0.7.38",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langchain-anthropic>=1.7.10",
    "langchain-ollama>=1.1.0",
    "chainlit>=2.12.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
